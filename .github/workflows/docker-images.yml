name: docker-images
# Triggered when a new version of the 'Dockerfile' or 'script/install_toolchain.sh' is pushed to the master branch.
# Can also be triggered manually.
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'Dockerfile'
      - 'script/install_toolchain.sh'

jobs:
  # The x86 images can be built on the HPI EPIC group's local VM infrastructure.
  build-x86-images:
    strategy:
      matrix:
        target: [ al2, ubuntu ]
    runs-on: [ self-hosted, X64, image ]
    name: Build x86 image
    steps:
      - name: Set the date for the image tag
        run: echo "IMAGE_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: hpiepic/skyrise:${{ matrix.target }}-x86-${{ env.IMAGE_DATE }},hpiepic/skyrise:${{ matrix.target }}-x86
          cache-from: type=registry,ref=hpiepic/skyrise:${{ matrix.target }}-x86
          cache-to: type=inline

  # In parallel, start the Amazon EC2 CI runner.
  start-ec2-instance:
    runs-on: [ self-hosted, amazonlinux2 ]
    name: Start Amazon EC2 Instance
    steps:
      - name: Start EC2 Instance
        run: |
          aws ec2 start-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

  # Build the ARM images on the Amazon EC2 runner and push them to DockerHub.
  build-arm-images:
    strategy:
      matrix:
        target: [ al2, ubuntu ]
    runs-on: [ self-hosted, ARM64, image ]
    name: Build ARM image
    needs: start-ec2-instance
    steps:
      - name: Set the date for the image tag
        run: echo "IMAGE_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: hpiepic/skyrise:${{ matrix.target }}-arm-${{ env.IMAGE_DATE }},hpiepic/skyrise:${{ matrix.target }}-arm
          cache-from: type=registry,ref=hpiepic/skyrise:${{ matrix.target }}-arm
          cache-to: type=inline

  # Stop the Amazon EC2 instance.
  stop-ec2-instance:
    runs-on: [ self-hosted, amazonlinux2 ]
    name: Stop Amazon EC2 Instance
    if: always()
    needs: [ start-ec2-instance, build-arm-images ]
    steps:
      - name: Stop EC2 Instance
        run: |
          aws ec2 stop-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
